name: regen-legal

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --no-frozen-lockfile
      - run: bun script/legal-search.ts
        working-directory: services/site
      - uses: actions/upload-artifact@v4
        with:
          name: legal-search
          path: services/site/src/component/site/legal-search.json
